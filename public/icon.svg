<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nexo IA">
  <!--
    O símbolo da marca Nexo IA: o nó central com as hastes radiais terminando em
    pontos, no degradê ciano→índigo sobre o navy da marca.

    Redesenhado em vetor a partir do logo (que só existe como imagem): num ícone
    de aba de 16px o wordmark "NEXO IA" viraria borrão, então fica só o símbolo —
    que é a parte reconhecível no tamanho pequeno. As 8 hastes são igualmente
    espaçadas de propósito: no logo grande a distribuição é orgânica, mas em 16px
    a assimetria lê como ruído.
  -->
  <defs>
    <linearGradient id="nexo" x1="3" y1="29" x2="29" y2="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19b4ea" />
      <stop offset="0.5" stop-color="#2f7bf0" />
      <stop offset="1" stop-color="#4b46e6" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#050e1f" />

  <!-- Traço e pontos são deliberadamente mais pesados do que a proporção do
       logo grande: em 16px o traço fino do original desaparece e sobra um
       borrão. Conferido nos três tamanhos (16/32/160), claro e escuro. -->
  <g stroke="url(#nexo)" stroke-width="2.3" stroke-linecap="round">
    <path d="M19.6 16H23.4" />
    <path d="M18.55 13.45 21.25 10.75" />
    <path d="M16 12.4V8.6" />
    <path d="M13.45 13.45 10.75 10.75" />
    <path d="M12.4 16H8.6" />
    <path d="M13.45 18.55 10.75 21.25" />
    <path d="M16 19.6V23.4" />
    <path d="M18.55 18.55 21.25 21.25" />
  </g>

  <g fill="url(#nexo)">
    <circle cx="16" cy="16" r="3.1" />
    <circle cx="26.1" cy="16" r="2.9" />
    <circle cx="23.15" cy="8.85" r="2.6" />
    <circle cx="16" cy="5.9" r="2.9" />
    <circle cx="8.85" cy="8.85" r="2.6" />
    <circle cx="5.9" cy="16" r="2.9" />
    <circle cx="8.85" cy="23.15" r="2.6" />
    <circle cx="16" cy="26.1" r="2.9" />
    <circle cx="23.15" cy="23.15" r="2.6" />
  </g>
</svg>
